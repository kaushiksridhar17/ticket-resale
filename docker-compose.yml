services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: facevalue
      POSTGRES_PASSWORD: facevalue
      POSTGRES_DB: facevalue
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facevalue -d facevalue"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  engine:
    build: ./engine
    ports:
      - "3001:3001"
    environment:
      LOGGER: "true"
      DATABASE_URL: postgres://facevalue:facevalue@db:5432/facevalue
      AUTH_PEPPER: ${AUTH_PEPPER:-development-pepper}
      DOOR_KEY: ${DOOR_KEY:-development-door-key}
      ORGANIZER_EMAILS: ${ORGANIZER_EMAILS:-}
      STAFF_EMAILS: ${STAFF_EMAILS:-}
      SECURE_COOKIES: "false"
    volumes:
      - engine-data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
        NEXT_PUBLIC_WS_URL: ws://localhost:3001/ws
    ports:
      - "3000:3000"
    depends_on:
      engine:
        condition: service_healthy
    restart: unless-stopped

volumes:
  engine-data:
  db-data: